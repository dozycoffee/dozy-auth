spring:
  application:
    name: dozy-auth
  docker:
    compose:
      # local 프로필에서만 켭니다 (application-local.yaml)
      enabled: false

# 서버가 받는 토큰의 검증 설정 (스타터 속성, docs/configuration.md §7). issuer-base-uri는 프로필별로 넣습니다.
dozy:
  auth:
    audience: auth
    accepted-realms: [internal]

---
# 공용 서버(dev, prod)는 환경 변수로 DB를 받습니다. 변수 목록은 docs/configuration.md §1
spring:
  config:
    activate:
      on-profile: dev | prod
  datasource:
    url: ${AUTH_DB_URL}
    username: ${AUTH_DB_USERNAME}
    password: ${AUTH_DB_PASSWORD}

dozy:
  auth:
    issuer-base-uri: ${AUTH_ISSUER_BASE_URL}
    cors:
      allowed-origins: ${AUTH_CORS_ALLOWED_ORIGINS}
    signing:
      keys-dir: ${AUTH_SIGNING_KEYS_DIR}
      active-kid: ${AUTH_SIGNING_ACTIVE_KID}
