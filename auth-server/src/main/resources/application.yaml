spring:
  application:
    name: dozy-auth
  docker:
    compose:
      # local 프로필에서만 켭니다 (application-local.yaml)
      enabled: false

# 클라이언트 주소 (docs/configuration.md §9). 신뢰할 프록시(internal-proxies)에서 온 요청일 때만 Tomcat이
# X-Forwarded-For·X-Forwarded-Proto로 remoteAddr·scheme을 바꿉니다. 요청 제한과 세션·감사 기록의 IP가 이 값입니다.
# 모든 프로필이 Spring Boot 기본값(사설·루프백 대역)을 신뢰합니다. 운영 배포 때 로드 밸런서 대역으로 좁힙니다.
server:
  forward-headers-strategy: native

# 지표·추적 (docs/configuration.md §10). Actuator는 상태 확인과 Prometheus 수집만 HTTP로 엽니다.
management:
  endpoints:
    web:
      exposure:
        include: health, prometheus

# 서버가 받는 토큰의 검증 설정 (스타터 속성, docs/configuration.md §7). issuer-base-uri는 프로필별로 넣습니다.
dozy:
  auth:
    audience: auth
    accepted-realms: [internal]
    # owner 부트스트랩 (docs/configuration.md §1, GOV-11). owner가 없을 때 필수이며, owner가 있으면 무시합니다
    bootstrap:
      owner-email: ${BOOTSTRAP_OWNER_EMAIL:}
    # 배포한 릴리스 버전(X.Y.Z). 기동 로그와 build_info 지표의 version이 됩니다. 없으면 빌드 때 넣은 sha-{7자리} (docs/configuration.md §12.1)
    release-version: ${AUTH_RELEASE_VERSION:}

---
# 공용 서버(dev, prod)는 환경 변수로 DB를 받습니다. 변수 목록은 docs/configuration.md §1
spring:
  config:
    activate:
      on-profile: dev | prod
  datasource:
    url: ${AUTH_DB_URL}
    username: ${AUTH_DB_USERNAME}
    password: ${AUTH_DB_PASSWORD}

dozy:
  auth:
    issuer-base-uri: ${AUTH_ISSUER_BASE_URL}
    cors:
      allowed-origins: ${AUTH_CORS_ALLOWED_ORIGINS}
    signing:
      keys-dir: ${AUTH_SIGNING_KEYS_DIR}
      active-kid: ${AUTH_SIGNING_ACTIVE_KID}

---
# 메일 (docs/configuration.md §7). 발송은 커밋 후 별도 스레드에서 하지만(architecture.md §9.3) SMTP가 멈췄을 때 스레드가 오래 붙잡히지 않게 시간 제한을 둡니다.
spring:
  mail:
    default-encoding: UTF-8
    properties:
      "[mail.smtp.connectiontimeout]": 5000
      "[mail.smtp.timeout]": 10000
      "[mail.smtp.writetimeout]": 10000

management:
  health:
    mail:
      # SMTP 장애로 서버 상태 전체가 DOWN이 되지 않게 합니다. 발송 실패는 로그로 봅니다.
      enabled: false

---
# 공용 서버(dev, prod)의 메일 설정은 환경 변수로 받습니다 (docs/configuration.md §1, §7)
spring:
  config:
    activate:
      on-profile: dev | prod
  mail:
    host: ${AUTH_MAIL_SMTP_HOST:}
    port: ${AUTH_MAIL_SMTP_PORT:587}
    username: ${AUTH_MAIL_SMTP_USERNAME:}
    password: ${AUTH_MAIL_SMTP_PASSWORD:}
    properties:
      "[mail.smtp.auth]": true
      "[mail.smtp.starttls.enable]": true
      "[mail.smtp.starttls.required]": true

dozy:
  auth:
    mail:
      sender: ${AUTH_MAIL_SENDER}
      from: ${AUTH_MAIL_FROM}
      app-url:
        internal: ${AUTH_APP_URL_INTERNAL}
        partner: ${AUTH_APP_URL_PARTNER}
