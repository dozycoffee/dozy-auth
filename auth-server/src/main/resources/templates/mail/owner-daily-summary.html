<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><title>일일 관리 요약</title></head>
<body style="font-family: sans-serif; line-height: 1.6; color: #222;">
<p>안녕하세요.</p>
<p><span th:text="${date}">날짜</span> Dozy Coffee 인증 관리 요약입니다.</p>
<p th:if="${rows.isEmpty()}">알릴 작업이 없었습니다.</p>
<table th:unless="${rows.isEmpty()}" style="border-collapse: collapse;">
  <tr th:each="row : ${rows}">
    <th style="text-align: left; padding: 4px 12px 4px 0;" th:text="${row.action}">작업</th>
    <td th:text="|${row.count}건|">0건</td>
  </tr>
</table>
<p>자세한 내용은 <a th:href="${consoleUrl}" href="#">관리 콘솔</a>의 감사 로그에서 확인할 수 있습니다.</p>
</body>
</html>
