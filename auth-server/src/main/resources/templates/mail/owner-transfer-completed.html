<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><title>owner 권한 양도 완료</title></head>
<body style="font-family: sans-serif; line-height: 1.6; color: #222;">
<p>안녕하세요.</p>
<p>Dozy Coffee 인증 관리의 owner 권한이 <span th:text="${newOwnerName}">이름</span>님에게 넘어갔습니다.<br>완료 시각: <span th:text="${transferredAt}">시각</span></p>
<p>이제 owner 권한이 없으며, 로그인된 기기에서는 모두 로그아웃되었습니다.</p>
<p style="font-size: 13px; color: #666;">직접 요청한 양도가 아니라면 바로 새 owner나 인프라 관리자에게 알려 주세요.</p>
</body>
</html>
