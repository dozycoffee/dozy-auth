<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><title>비밀번호 재설정</title></head>
<body style="font-family: sans-serif; line-height: 1.6; color: #222;">
<p>안녕하세요.</p>
<p>Dozy Coffee 계정의 비밀번호 재설정 요청을 받았습니다.<br>아래 버튼을 눌러 새 비밀번호를 정해 주세요.</p>
<p><a th:href="${link}" href="#" style="display: inline-block; padding: 10px 16px; background: #3b2a20; color: #fff; text-decoration: none; border-radius: 4px;">비밀번호 재설정하기</a></p>
<p style="font-size: 13px; color: #666;">버튼이 열리지 않으면 이 주소를 브라우저에 붙여 넣으세요.<br><span th:text="${link}">링크</span></p>
<p style="font-size: 13px; color: #666;">링크는 <span th:text="${expiresAt}">만료 시각</span>까지 한 번만 쓸 수 있습니다. 요청한 적이 없다면 이 메일을 무시해 주세요. 비밀번호는 바뀌지 않습니다.</p>
</body>
</html>
