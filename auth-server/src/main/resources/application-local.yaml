# 개발자 PC. 프로필별 동작은 docs/configuration.md §4
spring:
  docker:
    compose:
      enabled: true
      # 앱을 꺼도 DB와 Mailpit은 계속 띄워 둡니다. 멈추려면 docker compose stop
      lifecycle-management: start-only
  # DB 접속 정보는 Docker Compose 지원이 compose.yaml의 postgres에서 가져옵니다.
  mail:
    host: localhost
    port: 1025

dozy:
  auth:
    issuer-base-url: http://localhost:8080
    signing:
      # 없으면 만들어 저장하고 다음 기동부터 재사용합니다 (.local/은 git에 올리지 않음)
      keys-dir: .local/signing-keys
      auto-generate: true

logging:
  level:
    com.dozycoffee.auth: debug
    Exposed: debug # 실행되는 SQL

---
# 메일은 Mailpit(compose.yaml)으로 보냅니다. 메일함은 http://localhost:8025 (docs/configuration.md §5, §7)
dozy:
  auth:
    mail:
      sender: ${AUTH_MAIL_SENDER:smtp}
      from: ${AUTH_MAIL_FROM:no-reply@dozycoffee.local}
      app-url:
        internal: ${AUTH_APP_URL_INTERNAL:http://localhost:3000}
        partner: ${AUTH_APP_URL_PARTNER:http://localhost:3001}
