# 자동 테스트 (configuration.md §4). DB는 Testcontainers, 서명 키는 build/ 아래에 만들어 씁니다.
dozy:
  auth:
    issuer-base-uri: http://localhost:8080
    cors:
      allowed-origins: https://admin.dozycoffee.test
    signing:
      keys-dir: build/test-signing-keys
      auto-generate: true
    # 테스트 속도를 위해 가벼운 argon2id 파라미터를 씁니다 (configuration.md §6). 운영 기본값은 Argon2Properties
    password-hash:
      memory-kib: 1024
      iterations: 1
    # 테스트끼리 DB를 함께 쓰므로 기동할 때 owner를 만들지 않습니다. 부트스트랩 테스트만 켭니다 (configuration.md §4)
    bootstrap:
      enabled: false
    # 같은 이유로 정리 배치 스케줄러를 등록하지 않습니다. 정리 테스트는 UseCase를 직접 부릅니다 (configuration.md §11)
    cleanup:
      enabled: false

---
# 메일은 보내지 않고 로그로 출력합니다(링크의 토큰은 가림). 보낸 메일을 확인하는 테스트는 support/RecordingMailSender를 씁니다.
dozy:
  auth:
    mail:
      sender: console
      from: no-reply@dozycoffee.test
      app-url:
        internal: https://admin.dozycoffee.test
        partner: https://partner.dozycoffee.test
