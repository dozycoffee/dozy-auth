name: Publish

# 라이브러리(auth-core, auth-spring-boot-starter, auth-test)를 GitHub Packages에 배포한다.
# main의 커밋에 v{major}.{minor}.{patch} 태그를 push하면 실행된다 (README 배포 절).
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write # GitHub Release 생성
  packages: write # GitHub Packages 업로드

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # main 포함 여부 검사에 전체 기록이 필요

      # 리뷰와 CI를 거친 코드만 배포한다. 다른 브랜치의 커밋에 붙인 태그는 실패시킨다
      - name: 태그 커밋이 main에 있는지 확인
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_REF_NAME 태그의 커밋($GITHUB_SHA)이 main에 없습니다. main의 커밋에 태그를 붙이세요."
            exit 1
          fi

      # CI와 같은 JDK 구성: 라이브러리는 17, 서버는 21 toolchain
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: |
            17
            21

      - uses: gradle/actions/setup-gradle@v6

      # 테스트와 배포 메타데이터 검사(verifyPublicationMetadata)를 통과해야 배포한다
      - name: 빌드와 배포
        run: |
          ./gradlew build publish \
            -PreleaseVersion="${GITHUB_REF_NAME#v}" \
            -Porg.gradle.java.installations.fromEnv=JAVA_HOME_17_X64,JAVA_HOME_21_X64
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 릴리스 노트는 .github/release.yml의 라벨 분류로 만든다
      - name: GitHub Release 생성
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes --title "$GITHUB_REF_NAME"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: publish-reports
          path: '**/build/reports/'
          retention-days: 7
