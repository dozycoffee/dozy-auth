name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# PR은 새 커밋이 오면 이전 실행을 취소한다. main은 실행 중인 것을 취소하지 않는다.
# 이미지를 올리는 도중에 취소되면 그 커밋의 이미지가 없고 main 태그도 옮겨지지 않기 때문이다.
# main은 한 번에 하나씩 실행하므로 main 태그가 더 오래된 커밋으로 되돌아가지 않는다.
# 실행 중에 병합이 여러 번 쌓이면 GitHub가 대기 중인 것 중 마지막만 남기므로, 중간 커밋은 sha 태그가 없을 수 있다
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # 서버 이미지를 ghcr에 올리는 데만 packages: write가 필요하다. 로그인과 push는 main push일 때만 한다
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      # 라이브러리는 JDK 17, 서버는 JDK 21 toolchain을 쓴다. 마지막에 적은 21이 Gradle 실행용 기본 JDK가 된다.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: |
            17
            21

      - uses: gradle/actions/setup-gradle@v6

      # ktlint 검사, 테스트(Testcontainers는 러너의 Docker 사용), Konsist 아키텍처 테스트
      - run: ./gradlew build -Porg.gradle.java.installations.fromEnv=JAVA_HOME_17_X64,JAVA_HOME_21_X64

      # build-logic(included build)은 위 build에 포함되지 않아 따로 검사한다
      - run: ./gradlew -p build-logic ktlintCheck

      # 서버 이미지: 위 build가 테스트를 통과하고 만든 auth-server/build/libs/auth-server.jar를 담는다.
      # PR은 빌드만 확인하고, main push일 때만 sha-{7자리}와 main 태그로 ghcr에 올린다
      - uses: docker/setup-buildx-action@v4

      - if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: image-meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/dozycoffee/dozy-auth-api
          tags: |
            type=sha
            type=raw,value=main,enable={{is_default_branch}}

      - uses: docker/build-push-action@v7
        with:
          context: auth-server
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.image-meta.outputs.tags }}
          labels: ${{ steps.image-meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: '**/build/reports/'
          retention-days: 7
